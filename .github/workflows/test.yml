# Lints with Obsidian's review rules, builds and runs the tests on every push and pull request.
name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (Obsidian review rules)
        run: npm run lint
      - name: Build and test
        run: npm test
      - name: Manifest, package and versions agree
        run: |
          v=$(jq -r .version manifest.json)
          test "$(jq -r .version package.json)" = "$v"
          test "$(jq -r --arg v "$v" '.[$v]' versions.json)" = "$(jq -r .minAppVersion manifest.json)"
